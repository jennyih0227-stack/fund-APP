<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>誠毅基金淨值查詢</title>
<link rel="manifest" href="client.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="誠毅基金">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A; --navy-2:#2E4A7A; --gold:#C9A84C; --gold-d:#A07830;
    --cream:#FAF6EE; --gray:#E8E0D0; --charcoal:#333; --ink:#12203c;
    --up:#D42F2F; --down:#00934B;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --serif:"Noto Serif TC",serif; --num:"Lato","Noto Sans TC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans); color:var(--charcoal); background:var(--navy);
    background-image:radial-gradient(circle at 15% 0%, rgba(46,74,122,.55), transparent 42%),
      radial-gradient(circle at 90% 8%, rgba(201,168,76,.10), transparent 40%);
    min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 2px) 0 calc(env(safe-area-inset-bottom) + 20px);
  }
  header{max-width:720px; margin:0 auto; padding:10px 14px 4px; color:var(--cream)}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:13px; letter-spacing:.14em}
  .brand .cheng{color:var(--gold)}
  .brand .rule{flex:1; height:1px; background:linear-gradient(90deg,var(--gold-d),transparent)}
  h1{font-family:var(--serif); font-weight:700; font-size:24px; letter-spacing:.05em; margin-top:4px; color:var(--cream)}
  h1 .accent{color:var(--gold)}
  .meta{margin-top:5px; font-size:12px; color:#b9c2d6; display:flex; align-items:center; gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.2)}

  /* 控制列 */
  .controls{max-width:720px; margin:8px auto 0; padding:0 10px}
  .search{
    width:100%; font-family:var(--sans); font-size:15px; color:var(--ink);
    background:var(--cream); border:1px solid rgba(201,168,76,.4); border-radius:12px;
    padding:11px 14px; outline:none;
  }
  .search::placeholder{color:#a49a83}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px}
  .chip{
    font-size:12.5px; color:#cdd4e4; background:rgba(255,255,255,.06);
    border:1px solid rgba(201,168,76,.3); border-radius:999px; padding:6px 12px; cursor:pointer;
    white-space:nowrap; transition:.15s;
  }
  .chip.on{background:var(--gold); color:var(--navy); border-color:var(--gold); font-weight:700}
  .countbar{max-width:720px; margin:9px auto 0; padding:0 14px; color:#9aa4bd; font-size:12px;
    display:flex; justify-content:space-between; align-items:center}

  main{max-width:720px; margin:6px auto 0; padding:0 8px}
  .card{background:var(--cream); border-radius:14px; overflow:hidden; border:1px solid rgba(201,168,76,.25);
    box-shadow:0 10px 30px -14px rgba(0,0,0,.45)}
  .row{
    position:relative; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px;
    padding:9px 12px 9px 10px; border-bottom:1px solid var(--gray);
  }
  .row:last-child{border-bottom:none}
  .star{font-size:21px; line-height:1; color:#c9c0aa; cursor:pointer; width:26px; text-align:center; flex:0 0 auto; user-select:none}
  .row.fav .star{color:var(--gold)}
  .r-name{min-width:0}
  .r-name .nm{font-size:14px; font-weight:500; color:var(--ink); line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .r-name .sub{font-size:11px; color:#9a927f; margin-top:2px; font-family:var(--num); display:flex; gap:8px}
  .cur{color:var(--navy-2); font-weight:700}
  .r-right{text-align:right; white-space:nowrap; flex:0 0 auto}
  .val{font-family:var(--num); font-weight:800; font-size:15px; color:var(--ink)}
  .pct{font-family:var(--num); font-weight:900; font-size:12.5px; margin-top:1px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:#8a8270}
  .pct .ar{font-size:10px; margin-right:1px}
  .view{
    display:inline-block; font-size:12px; font-weight:700; color:var(--navy);
    background:var(--gold); border-radius:999px; padding:6px 12px; text-decoration:none;
  }
  .empty{color:#b9c2d6; text-align:center; padding:40px 20px; font-size:14px; line-height:1.8}

  footer{max-width:720px; margin:16px auto 0; padding:0 18px; text-align:center; color:#8b95ab; font-size:11px; line-height:1.9}
  footer .motto{color:var(--gold); font-family:var(--serif); letter-spacing:.18em; font-size:12px}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
    background:var(--charcoal); color:#fff; font-size:13px; padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:.25s; z-index:40; box-shadow:0 10px 28px -8px rgba(0,0,0,.6)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span><span class="cheng">誠毅</span>傳承</span><span class="rule"></span><span>熊誠毅</span></div>
  <h1>基金淨值<span class="accent">查詢</span></h1>
  <div class="meta"><span class="dot"></span><span id="updated">載入中…</span></div>
</header>

<div class="controls">
  <input class="search" id="q" type="search" inputmode="search" placeholder="搜尋基金名稱或代碼…" autocomplete="off">
  <div class="chips" id="chips">
    <span class="chip on" data-f="all">全部</span>
    <span class="chip" data-f="mine">★ 我的基金</span>
    <span class="chip" data-c="USD">美元</span>
    <span class="chip" data-c="TWD">台幣</span>
    <span class="chip" data-c="EUR">歐元</span>
    <span class="chip" data-c="RMB">人民幣</span>
    <span class="chip" data-c="OTHER">其他</span>
  </div>
</div>
<div class="countbar"><span id="count"></span><span id="myhint"></span></div>

<main><div class="card" id="list"></div></main>

<footer>
  <div class="motto">誠於心・毅於行・傳於世・承於志</div>
  <div>投資型基金淨值每日更新一次，僅供參考，不構成投資建議</div>
</footer>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CUR_LABEL = {USD:'美元',TWD:'台幣',EUR:'歐元',RMB:'人民幣',ZAR:'南非幣',AUD:'澳幣',JPY:'日圓',GBP:'英鎊',OTHER:'其他'};
const LS_KEY = 'myfunds_xinxin';
let ALL = [];
let fav = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));
let mode = 'all';      // all | mine
let curFilter = null;  // USD/TWD/...

function saveFav(){ localStorage.setItem(LS_KEY, JSON.stringify([...fav])); }

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

function fmtVal(v){
  if(v==null) return '';
  return (Math.abs(v)>=1000) ? Math.round(v).toLocaleString('en-US')
       : v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:4});
}
function fmtPct(p){
  if(p==null) return '';
  const cls = p>0.0001?'up':(p<-0.0001?'down':'flat');
  const ar = p>0.0001?'▲':(p<-0.0001?'▼':'—');
  const s = p>0?'+':'';
  return `<div class="pct ${cls}"><span class="ar">${ar}</span>${s}${p.toFixed(2)}%</div>`;
}

function matches(f){
  if(mode==='mine' && !fav.has(f.tf)) return false;
  if(curFilter && f.cur !== curFilter) return false;
  const q = $('#q').value.trim().toLowerCase();
  if(q && !(f.name.toLowerCase().includes(q) || f.tf.toLowerCase().includes(q))) return false;
  return true;
}

function render(){
  const list = $('#list');
  const rows = ALL.filter(matches);
  $('#count').textContent = `顯示 ${rows.length} 檔`;
  $('#myhint').textContent = fav.size ? `我的基金 ${fav.size} 檔` : '點 ☆ 加入我的基金';
  if(!rows.length){
    list.innerHTML = `<div class="empty">${mode==='mine'&&!fav.size?'還沒有加入任何基金<br>在清單點 ☆ 把你持有的基金加進來':'沒有符合的基金'}</div>`;
    return;
  }
  let html='';
  for(const f of rows){
    const favc = fav.has(f.tf) ? 'fav' : '';
    const star = fav.has(f.tf) ? '★' : '☆';
    let right;
    if(f.ok){
      right = `<div class="val">${fmtVal(f.value)}</div>${fmtPct(f.pct)}`;
    }else{
      right = `<a class="view" href="${f.link}" target="_blank" rel="noopener">查看</a>`;
    }
    const dt = f.ok && f.date ? f.date : '';
    html += `<div class="row ${favc}" data-tf="${f.tf}">
      <div class="star" data-star="${f.tf}">${star}</div>
      <div class="r-name">
        <div class="nm">${f.name}</div>
        <div class="sub"><span class="cur">${CUR_LABEL[f.cur]||f.cur}</span>${dt?`<span>${dt}</span>`:''}<span>${f.tf}</span></div>
      </div>
      <div class="r-right">${right}</div>
    </div>`;
  }
  list.innerHTML = html;
}

// 事件：星號切換
$('#list').addEventListener('click', e => {
  const s = e.target.closest('[data-star]');
  if(!s) return;
  const tf = s.getAttribute('data-star');
  if(fav.has(tf)){ fav.delete(tf); toast('已從我的基金移除'); }
  else{ fav.add(tf); toast('已加入我的基金'); }
  saveFav(); render();
});
// 搜尋
$('#q').addEventListener('input', render);
// 篩選 chips
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  if(c.dataset.f){ // all / mine
    mode = c.dataset.f;
    curFilter = null;
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
  }else if(c.dataset.c){
    if(curFilter === c.dataset.c){ curFilter=null; c.classList.remove('on'); }
    else{ curFilter = c.dataset.c;
      document.querySelectorAll('.chip[data-c]').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); }
  }
  render();
});

async function load(){
  try{
    const res = await fetch('funds_client.json?t=' + Date.now(), {cache:'no-store'});
    const data = await res.json();
    ALL = data.funds || [];
    $('#updated').textContent = `${data.product||''}　更新於 ${data.updated_at||'—'}　共 ${data.total||ALL.length} 檔`;
    render();
  }catch(e){
    $('#updated').textContent = '資料載入失敗，請稍後重試';
    $('#list').innerHTML = '<div class="empty">尚未有資料，請稍後再試</div>';
  }
}
load();
</script>
</body>
</html>
