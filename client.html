<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>誠毅基金淨值查詢</title>
<link rel="manifest" href="client.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="誠毅基金">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A; --navy-2:#2E4A7A; --gold:#C9A84C; --gold-d:#A07830;
    --cream:#FAF6EE; --gray:#E8E0D0; --charcoal:#333; --ink:#12203c;
    --up:#D42F2F; --down:#00934B;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --serif:"Noto Serif TC",serif; --num:"Lato","Noto Sans TC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans); color:var(--charcoal); background:var(--navy);
    background-image:radial-gradient(circle at 15% 0%, rgba(46,74,122,.55), transparent 42%),
      radial-gradient(circle at 90% 8%, rgba(201,168,76,.10), transparent 40%);
    min-height:100vh; padding:calc(env(safe-area-inset-top) + 2px) 0 calc(env(safe-area-inset-bottom) + 20px);
  }
  header{max-width:760px; margin:0 auto; padding:10px 14px 4px; color:var(--cream)}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:13px; letter-spacing:.14em}
  .brand .cheng{color:var(--gold)}
  .brand .rule{flex:1; height:1px; background:linear-gradient(90deg,var(--gold-d),transparent)}
  h1{font-family:var(--serif); font-weight:700; font-size:24px; letter-spacing:.05em; margin-top:4px; color:var(--cream)}
  h1 .accent{color:var(--gold)}
  .meta{margin-top:5px; font-size:12px; color:#b9c2d6; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.2)}

  .controls{max-width:760px; margin:8px auto 0; padding:0 10px}
  .search{width:100%; font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--cream);
    border:1px solid rgba(201,168,76,.4); border-radius:12px; padding:11px 14px; outline:none}
  .search::placeholder{color:#a49a83}
  .frow{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center}
  .flabel{font-size:11px; color:#8b95ab; margin-right:2px; flex:0 0 auto}
  .chip{font-size:12px; color:#cdd4e4; background:rgba(255,255,255,.06); border:1px solid rgba(201,168,76,.3);
    border-radius:999px; padding:5px 11px; cursor:pointer; white-space:nowrap; transition:.15s}
  .chip.on{background:var(--gold); color:var(--navy); border-color:var(--gold); font-weight:700}
  .chip.sort.on{background:var(--navy-2); color:#fff; border-color:var(--navy-2)}
  .countbar{max-width:760px; margin:9px auto 0; padding:0 14px; color:#9aa4bd; font-size:12px;
    display:flex; justify-content:space-between; align-items:center}

  main{max-width:760px; margin:6px auto 0; padding:0 8px}
  .card{background:var(--cream); border-radius:14px; overflow:hidden; border:1px solid rgba(201,168,76,.25);
    box-shadow:0 10px 30px -14px rgba(0,0,0,.45)}
  .row{position:relative; border-bottom:1px solid var(--gray)}
  .row:last-child{border-bottom:none}
  .rowmain{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:9px; padding:9px 12px 9px 8px}
  .pt{color:var(--navy-2); font-weight:700; cursor:pointer; user-select:none}
  .perfgrid{display:none; grid-template-columns:repeat(3,1fr); gap:6px 4px; padding:2px 12px 10px 40px}
  .row.open .perfgrid{display:grid}
  .pcell{background:#f2ebda; border-radius:8px; padding:5px 4px; text-align:center}
  .pcell .pl{font-size:10px; color:#8a8270}
  .pcell .pv{font-family:var(--num); font-weight:900; font-size:13px; margin-top:1px}
  .pcell.hl{outline:2px solid var(--gold)}
  .star{font-size:20px; line-height:1; color:#c9c0aa; cursor:pointer; width:24px; text-align:center; flex:0 0 auto; user-select:none}
  .row.fav .star{color:var(--gold)}
  .rank{position:absolute; left:6px; top:6px; font-family:var(--num); font-size:10px; font-weight:900; color:var(--gold-d)}
  .r-name{min-width:0}
  .nm{font-size:14px; font-weight:600; color:var(--navy-2); line-height:1.35; text-decoration:none;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .nm .lk{font-size:11px; color:var(--gold-d)}
  .sub{font-size:11px; color:#8a8270; margin-top:3px; font-family:var(--num); display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .tag{font-family:var(--sans); font-size:10px; font-weight:700; padding:1px 6px; border-radius:6px}
  .t-rr{background:#e9dfc4; color:#7a5f1e}
  .t-dist{background:#d9ece0; color:#0a7a45}
  .t-cur{color:var(--navy-2); font-weight:700}
  .r-right{text-align:right; white-space:nowrap; flex:0 0 auto; min-width:66px}
  .val{font-family:var(--num); font-weight:800; font-size:15px; color:var(--ink)}
  .pct{font-family:var(--num); font-weight:900; font-size:12.5px; margin-top:1px}
  .perfbig{font-family:var(--num); font-weight:900; font-size:15px}
  .perflab{font-size:10px; color:#8a8270; font-weight:400}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:#8a8270}
  .pct .ar,.perfbig .ar{font-size:10px; margin-right:1px}
  .view{display:inline-block; font-size:12px; font-weight:700; color:var(--navy); background:var(--gold);
    border-radius:999px; padding:6px 12px; text-decoration:none}
  .empty{color:#b9c2d6; text-align:center; padding:40px 20px; font-size:14px; line-height:1.8}
  footer{max-width:760px; margin:16px auto 0; padding:0 18px; text-align:center; color:#8b95ab; font-size:11px; line-height:1.9}
  footer .motto{color:var(--gold); font-family:var(--serif); letter-spacing:.18em; font-size:12px}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px); background:var(--charcoal);
    color:#fff; font-size:13px; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:.25s; z-index:40; box-shadow:0 10px 28px -8px rgba(0,0,0,.6)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span><span class="cheng">誠毅</span>傳承</span><span class="rule"></span><span>熊誠毅</span></div>
  <h1>基金淨值<span class="accent">查詢</span></h1>
  <div class="meta"><span class="dot"></span><span id="updated">載入中…</span></div>
</header>

<div class="controls">
  <input class="search" id="q" type="search" inputmode="search" placeholder="搜尋基金名稱或代碼…" autocomplete="off">
  <div class="frow" id="fMain">
    <span class="chip on" data-f="all">全部</span>
    <span class="chip" data-f="mine">★ 我的基金</span>
  </div>
  <div class="frow" id="fCur">
    <span class="flabel">幣別</span>
    <span class="chip" data-c="USD">美元</span><span class="chip" data-c="TWD">台幣</span>
    <span class="chip" data-c="EUR">歐元</span><span class="chip" data-c="RMB">人民幣</span>
    <span class="chip" data-c="OTHER">其他</span>
  </div>
  <div class="frow" id="fRR">
    <span class="flabel">風險</span>
    <span class="chip" data-r="RR1">RR1</span><span class="chip" data-r="RR2">RR2</span>
    <span class="chip" data-r="RR3">RR3</span><span class="chip" data-r="RR4">RR4</span>
    <span class="chip" data-r="RR5">RR5</span>
  </div>
  <div class="frow" id="fDist">
    <span class="flabel">配息</span>
    <span class="chip" data-d="配息">配息</span><span class="chip" data-d="未配息">未配息</span>
  </div>
  <div class="frow" id="fSort">
    <span class="flabel">排名依績效</span>
    <span class="chip sort" data-s="m1">1月</span><span class="chip sort" data-s="m3">3月</span>
    <span class="chip sort" data-s="m6">6月</span><span class="chip sort" data-s="m12">1年</span>
    <span class="chip sort" data-s="m36">3年</span><span class="chip sort" data-s="m60">5年</span>
  </div>
</div>
<div class="countbar"><span id="count"></span><span id="myhint"></span></div>

<main><div class="card" id="list"></div></main>

<footer>
  <div class="motto">誠於心・毅於行・傳於世・承於志</div>
  <div>投資型基金淨值每日更新一次，績效為過去表現不代表未來，僅供參考不構成投資建議</div>
</footer>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CUR_LABEL = {USD:'美元',TWD:'台幣',EUR:'歐元',RMB:'人民幣',ZAR:'南非幣',AUD:'澳幣',JPY:'日圓',GBP:'英鎊',OTHER:'其他'};
const PERF_LABEL = {m1:'1月',m3:'3月',m6:'6月',m12:'1年',m36:'3年',m60:'5年'};
const LS_KEY = 'myfunds_xinxin';
let ALL=[], fav=new Set(JSON.parse(localStorage.getItem(LS_KEY)||'[]'));
let mode='all', curF=null, rrF=null, distF=null, sortK=null;

function saveFav(){ localStorage.setItem(LS_KEY, JSON.stringify([...fav])); }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1600); }

function fmtVal(v){ if(v==null)return'';
  return Math.abs(v)>=1000 ? Math.round(v).toLocaleString('en-US') : v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4}); }
function pctHtml(p,cls0){ if(p==null)return'<span class="flat">—</span>';
  const cls=p>0.0001?'up':(p<-0.0001?'down':'flat'), ar=p>0.0001?'▲':(p<-0.0001?'▼':'—'), s=p>0?'+':'';
  return `<span class="${cls}"><span class="ar">${ar}</span>${s}${p.toFixed(2)}%</span>`; }

function matches(f){
  if(mode==='mine' && !fav.has(f.tf)) return false;
  if(curF && f.cur!==curF) return false;
  if(rrF && f.rr!==rrF) return false;
  if(distF && f.dist!==distF) return false;
  const q=$('#q').value.trim().toLowerCase();
  if(q && !(f.name.toLowerCase().includes(q)||f.tf.toLowerCase().includes(q))) return false;
  if(sortK && (!f.perf || f.perf[sortK]==null)) return false; // 排名時只列有該期績效者
  return true;
}

function render(){
  const list=$('#list');
  let rows=ALL.filter(matches);
  if(sortK) rows.sort((a,b)=> (b.perf[sortK]) - (a.perf[sortK]));
  $('#count').textContent=`顯示 ${rows.length} 檔`+(sortK?`（依${PERF_LABEL[sortK]}報酬排名）`:'');
  $('#myhint').textContent=fav.size?`我的基金 ${fav.size} 檔`:'點 ☆ 加入我的基金';
  if(!rows.length){ list.innerHTML=`<div class="empty">${mode==='mine'&&!fav.size?'還沒有加入任何基金<br>在清單點 ☆ 把你持有的基金加進來':'沒有符合條件的基金'}</div>`; return; }
  let html='';
  rows.forEach((f,idx)=>{
    const favc=fav.has(f.tf)?'fav':'', star=fav.has(f.tf)?'★':'☆';
    const rankBadge=sortK?`<div class="rank">#${idx+1}</div>`:'';
    const tags=`${f.rr?`<span class="tag t-rr">${f.rr}</span>`:''}${f.dist==='配息'?`<span class="tag t-dist">配息</span>`:''}`;
    const hasPerf=f.perf && Object.keys(f.perf).length>0;
    let right;
    if(sortK){
      right=`<div class="perfbig">${pctHtml(f.perf[sortK])}</div><div class="perflab">${PERF_LABEL[sortK]}報酬</div><div class="val" style="font-size:12px;font-weight:700;margin-top:2px">${fmtVal(f.value)}</div>`;
    }else if(f.ok){
      right=`<div class="val">${fmtVal(f.value)}</div><div class="pct">${pctHtml(f.pct)}</div>`;
    }else{
      right=`<a class="view" href="${f.link}" target="_blank" rel="noopener">查看</a>`;
    }
    const dt=f.ok&&f.date?`<span>${f.date}</span>`:'';
    const ptoggle=hasPerf?`<span class="pt" data-pt="1">績效 ▾</span>`:'';
    let grid='';
    if(hasPerf){
      grid='<div class="perfgrid">'+['m1','m3','m6','m12','m36','m60'].map(k=>{
        const v=f.perf[k]; const cls=v==null?'flat':(v>0?'up':(v<0?'down':'flat')); const hl=(k===sortK)?' hl':'';
        return `<div class="pcell${hl}"><div class="pl">${PERF_LABEL[k]}</div><div class="pv ${cls}">${v==null?'—':(v>0?'+':'')+v.toFixed(2)+'%'}</div></div>`;
      }).join('')+'</div>';
    }
    const openc=(sortK && hasPerf)?' open':'';
    html+=`<div class="row ${favc}${openc}" data-tf="${f.tf}">${rankBadge}
      <div class="rowmain">
        <div class="star" data-star="${f.tf}">${star}</div>
        <div class="r-name">
          <a class="nm" href="${f.link}" target="_blank" rel="noopener">${f.name} <span class="lk">↗</span></a>
          <div class="sub"><span class="t-cur">${CUR_LABEL[f.cur]||f.cur}</span>${tags}${dt}<span>${f.tf}</span>${ptoggle}</div>
        </div>
        <div class="r-right">${right}</div>
      </div>${grid}
    </div>`;
  });
  list.innerHTML=html;
}

$('#list').addEventListener('click',e=>{
  const pt=e.target.closest('[data-pt]');
  if(pt){ e.preventDefault(); pt.closest('.row').classList.toggle('open'); return; }
  const s=e.target.closest('[data-star]'); if(!s)return;
  e.preventDefault();
  const tf=s.getAttribute('data-star');
  if(fav.has(tf)){fav.delete(tf); toast('已移除');} else {fav.add(tf); toast('已加入我的基金');}
  saveFav(); render();
});
$('#q').addEventListener('input',render);

function bindSingle(sel, apply){
  $(sel).addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c)return;
    const was=c.classList.contains('on');
    $(sel).querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    if(!was){ c.classList.add('on'); apply(c); } else { apply(null); }
    render();
  });
}
$('#fMain').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c)return;
  mode=c.dataset.f; $('#fMain').querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); render();
});
bindSingle('#fCur', c=> curF = c?c.dataset.c:null);
bindSingle('#fRR',  c=> rrF  = c?c.dataset.r:null);
bindSingle('#fDist',c=> distF= c?c.dataset.d:null);
bindSingle('#fSort',c=> sortK= c?c.dataset.s:null);

async function load(){
  try{
    const res=await fetch('funds_client.json?t='+Date.now(),{cache:'no-store'});
    const data=await res.json();
    ALL=data.funds||[];
    $('#updated').textContent=`${data.product||''}　更新 ${data.updated_at||'—'}　共 ${data.total||ALL.length} 檔`;
    render();
  }catch(e){ $('#updated').textContent='資料載入失敗，請稍後重試'; $('#list').innerHTML='<div class="empty">尚未有資料</div>'; }
}
load();
</script>
</body>
</html>
