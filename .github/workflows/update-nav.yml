name: 更新基金淨值

on:
  schedule:
    # 台灣時間每日 15:30（收盤後），UTC 07:30
    - cron: "30 7 * * 1-5"
    # 台灣時間每日 22:00（美股/基金淨值到齊），UTC 14:00
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}   # 允許手動執行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: pip install requests yfinance urllib3

      - name: 抓取淨值
        run: python scripts/fetch_nav.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "資料無變化，略過提交"
          else
            git commit -m "自動更新淨值 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
